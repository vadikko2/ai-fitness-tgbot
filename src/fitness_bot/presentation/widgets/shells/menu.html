<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<!-- chrome -->
<style>
header{display:none}
.wrap{padding:0}
.hero{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:linear-gradient(160deg,#FFF4B8 0%,#F7F8FA 58%,#EEF2F7 100%)}
.hero em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(2,32,70,.42)}
.hero b{display:block;margin-top:6px;font-size:22px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.hero .goal{display:block;margin-top:6px;font-size:13px;font-weight:500;color:rgba(2,32,70,.55);line-height:1.3}
.hero .goal:empty{display:none}
.hero .coach{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px;min-height:0;border-radius:999px;background:rgba(2,32,70,.06);color:#022046;font-size:13px;font-weight:600;line-height:1.2;text-align:left}
.hero .coach u{font-style:normal;text-decoration:none;border-bottom:1px solid rgba(2,32,70,.28)}
#hint:empty{display:none}
#hint{margin:0 0 8px}
.nav button{display:block;width:100%;box-sizing:border-box;margin:0 0 8px;padding:12px 14px;min-height:48px;background:#F2F4F7;border-radius:14px;text-align:left;font-weight:600;font-size:15px;line-height:1.25;white-space:normal}
.nav button.p{background:#F5D22D;text-align:center;font-size:16px;letter-spacing:-.02em}
.nav button.blue{background:#022046;color:#fff;text-align:center}
.nav button.ghost{background:#fff;border:1px solid rgba(2,32,70,.14);font-weight:500;color:rgba(2,32,70,.82)}
.nav button:last-child{margin-bottom:0}
</style>
<div class="wrap">
<div class="hero">
<em id="tag">Сегодня</em>
<b id="status">Главное</b>
<span class="goal" id="goal"></span>
<button type="button" class="coach" id="coach" data-op="cfind"><u id="coachLabel">Найти тренера</u></button>
</div>
<p class="hint" id="hint"></p>
<nav class="nav" id="nav"></nav>
</div>
<p id="e"></p>
<script>
(function(){
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function statusOf(d){
if(d.mode=="live"){return "Тренировка идёт";}
if(d.mode=="again"){return "Уже сделано";}
if(d.weekDone&&d.mode=="rest"){return "Неделя закрыта";}
if(d.mode=="rest"){return "Сегодня отдых";}
if(d.mode=="none"){return "Нужна программа";}
return d.workout||"Готов к тренировке";
}
function restLine(d){
if(d.weekDone){return "Можно собрать следующую тренировочную неделю";}
if(d.cta){return "Можно пройти другой день плана";}
return "На этой неделе открытых дней нет";
}
function ctaOf(d){
if(d.mode=="live"){return "Продолжить";}
if(d.mode=="again"){return "К тренировке";}
if(d.mode=="rest"&&d.cta){return "Всё равно потренироваться · "+d.cta;}
if(d.mode=="rest"){return "Открытых дней нет";}
if(d.mode=="none"){return "Открыть план";}
return "Начать тренировку";
}
function render(d){
if(!d){return;}
$("t").textContent="Главное";
$("s").textContent="";
$("tag").textContent=d.when||"Меню";
$("status").textContent=statusOf(d);
$("goal").textContent=d.mode=="rest"?restLine(d):(d.weekDone?"Неделя закрыта — можно собрать следующую":(d.goal||""));
$("hint").textContent=d.hint||"";
var mine=d.coach==="mine",coach=$("coach");
coach.setAttribute("data-op",mine?"cmine":"cfind");
$("coachLabel").textContent=mine?(d.coachName?("Тренер · "+d.coachName):"Мой тренер"):"Найти тренера";
var html="",showTrain=!(d.mode=="rest"&&!d.cta);
if(d.weekDone){html+='<button type="button" class="p" data-op="nweek">Новая неделя</button>';}
if(showTrain){html+='<button type="button" class="'+(d.weekDone?"ghost":"p")+'" data-op="train">'+esc(ctaOf(d))+'</button>';}
html+='<button type="button" class="blue" data-op="prof">Профиль</button>';
if(d.cab!=="cab"){html+='<button type="button" class="ghost" data-op="apply">Стать тренером</button>';}
if(d.mod){html+='<button type="button" class="ghost" data-op="mod">Модератор</button>';}
$("nav").innerHTML=html;
}
function rawOf(answer){if(!answer){return "";}if(typeof answer=="string"){return answer;}return typeof answer.result=="string"?answer.result:"";}
function take(answer){$("e").textContent="";var raw=rawOf(answer);if(!raw){return;}var d;try{d=JSON.parse(raw);}catch(err){return;}if(d.err){$("e").textContent="Не вышло";return;}render(d);}
function fail(err){var code=err&&err.code;if(code=="TIMEOUT"||code=="FAILED"){$("e").textContent="Нет связи";}}
document.body.addEventListener("click",function(ev){var node=ev.target&&ev.target.closest?ev.target.closest("[data-op]"):null;var op=node&&node.getAttribute("data-op");if(!op){return;}$("e").textContent="";TelegramWidget.request(op).then(take,fail);});
function boot(){try{render(JSON.parse(TelegramWidget.chatData));}catch(err){}if(TelegramWidget.onEvent){TelegramWidget.onEvent("chatDataChanged",function(){try{render(JSON.parse(TelegramWidget.chatData));}catch(err){}});}}
boot();
})();
</script>
</body></html>
