<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<!-- chrome -->
<style>
.card{margin:8px 0 12px;padding:14px;border-radius:16px;background:#F7F8FA}
.card p{margin:0;font-size:13px;font-weight:500;color:rgba(2,32,70,.55);line-height:1.35}
#streak:empty,#note:empty,#hint:empty{display:none}
#streak,#hint{margin:0 0 10px}
</style>
<p class="hint" id="streak"></p>
<p class="hint" id="hint"></p>
<div class="card hide" id="note"><p id="noteText"></p></div>
<button type="button" class="p" id="go" data-op="go">Начать</button>
<button type="button" class="back hide" id="alt" data-op="go">Ещё одну</button>
<button type="button" class="back" id="menu" data-op="menu">В меню</button>
<p id="e"></p>
<script>
(function(){
function $(id){return document.getElementById(id);}
function show(node,on){node.classList.toggle("hide",!on);}
function render(d){
if(!d){return;}
$("t").textContent=d.title||"";
$("s").textContent=d.when||"";
$("streak").textContent=d.streak==null?"":("Серия "+d.streak);
$("hint").textContent=d.hint||"";
var go=$("go"),alt=$("alt"),mode=d.mode||"go",hasAlt=!!(d.alt&&d.altDay),fresh=!!d.weekDone&&mode=="rest"&&!hasAlt;
if(mode=="again"){
go.textContent="Повторить";go.setAttribute("data-op","again");
$("noteText").textContent="Можно пройти день ещё раз или взять другой.";
}else if(mode=="live"){
go.textContent="Продолжить";go.setAttribute("data-op","go");
$("noteText").textContent="Сессия уже открыта.";
}else if(fresh){
go.textContent="Новая неделя";go.setAttribute("data-op","go");
$("noteText").textContent="Неделя закрыта. Можно сразу собрать следующую.";
}else if(mode=="rest"){
go.textContent="Начать";go.setAttribute("data-op","go");
$("noteText").textContent=hasAlt?("Сегодня отдых. Ближайший день — "+d.alt+"."):"По плану сегодня отдых. Открытых дней на этой неделе нет.";
}else if(mode=="none"){
go.textContent="В меню";go.setAttribute("data-op","menu");
$("noteText").textContent="Сначала нужен план тренировок.";
}else{
go.textContent="Начать";go.setAttribute("data-op","go");
$("noteText").textContent=d.weekDone?"Неделя уже закрыта — новую соберём из меню.":"";
}
if(mode=="again"&&hasAlt){$("noteText").textContent="Можно повторить сегодня или взять "+d.alt+".";}
show($("note"),!!$("noteText").textContent);
if(mode=="rest"&&hasAlt){
alt.textContent="Потренироваться";
alt.setAttribute("data-op","day:"+d.altDay);
alt.className="p";
show(alt,true);
show(go,false);
}else if(hasAlt){
alt.textContent="Другой день";
alt.setAttribute("data-op","day:"+d.altDay);
alt.className=(mode=="again")?"p":"back";
show(alt,true);
show(go,mode!="none");
go.className=(mode=="again")?"back":"p";
}else{
show(alt,false);
show(go,fresh||(mode!="rest"&&mode!="none"));
go.className="p";
}
}
function rawOf(answer){if(!answer){return "";}if(typeof answer=="string"){return answer;}return typeof answer.result=="string"?answer.result:"";}
function take(answer){$("e").textContent="";var raw=rawOf(answer);if(!raw){return;}var d;try{d=JSON.parse(raw);}catch(err){return;}if(d.err){$("e").textContent="Не вышло";return;}render(d);}
function fail(err){var code=err&&err.code;if(code=="TIMEOUT"||code=="FAILED"){$("e").textContent="Нет связи";}}
document.body.addEventListener("click",function(ev){var node=ev.target&&ev.target.closest?ev.target.closest("[data-op]"):null;var op=node&&node.getAttribute("data-op");if(!op){return;}$("e").textContent="";TelegramWidget.request(op).then(take,fail);});
function boot(){try{render(JSON.parse(TelegramWidget.chatData));}catch(err){}if(TelegramWidget.onEvent){TelegramWidget.onEvent("chatDataChanged",function(){try{render(JSON.parse(TelegramWidget.chatData));}catch(err){}});}}
boot();
})();
</script>
</body></html>
