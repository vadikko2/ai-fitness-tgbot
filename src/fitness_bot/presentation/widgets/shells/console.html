<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<!-- chrome -->
<style>
.dots{display:flex;gap:6px;margin:0 0 12px}
.dots:empty{display:none}
.dots i{width:8px;height:8px;border-radius:50%;background:#E6EAF0}
.dots i.done{background:#F5D22D}
.dots i.now{background:#022046}
.hero{margin:8px 0 12px;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.hero span{font-weight:500;color:rgba(2,32,70,.45)}
.step{display:flex;gap:8px}
.step div{flex:1;min-width:0}
.step small{display:block;margin:0 0 4px;font-size:11px;font-weight:500;color:rgba(2,32,70,.6)}
.step p{display:flex;gap:8px;margin:0}
.step button{flex:1;height:36px;padding:0;background:#F2F4F7;border-radius:10px;font-size:18px}
.links{margin:2px 0;text-align:center;color:rgba(2,32,70,.35)}
.links button{font-weight:500;padding:6px 4px}
#ringbox{margin:0 0 4px;text-align:center}
.rows button{display:block;width:100%;margin:0 0 8px;padding:0 12px;height:44px;background:#F2F4F7;border-radius:12px;text-align:left;font-weight:500}
#tip{margin:4px 0 0;max-height:200px;overflow:auto;font-size:15px;line-height:1.4;white-space:pre-wrap}
#pad{display:flex;flex-wrap:wrap;gap:6px}
#pad button{width:30%;height:36px;padding:0;background:#F2F4F7;border-radius:10px}
</style>
<div class="bar"><span id="bar"></span></div>
<div class="dots" id="dots"></div>
<div id="ringbox" class="hide"><svg id="ring" viewBox="0 0 36 36" width="72" height="72"><circle cx="18" cy="18" r="16" stroke="#E6EAF0" fill="none" stroke-width="2"></circle><circle id="arc" cx="18" cy="18" r="16" stroke="#F5D22D" fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="0" transform="rotate(-90 18 18)"></circle></svg></div>
<p class="hero" id="hero"></p>
<div id="work">
<div class="step">
<div><small>кг</small><p><button type="button" data-op="w-">−</button><button type="button" data-op="w+">+</button></p></div>
<div><small id="unit">повт</small><p><button type="button" data-op="r-">−</button><button type="button" data-op="r+">+</button></p></div>
</div>
</div>
<button type="button" class="p" id="go" data-op="ok">Готово</button>
<button type="button" class="back" id="skip" data-op="skip">Пропустить</button>
<p class="links" id="q2"><button type="button" data-op="alt">Замена</button> · <button type="button" data-op="how">Как делать</button> · <button type="button" data-op="vid">Техника</button> · <button type="button" data-op="kg">Точно</button></p>
<div id="alt" class="rows hide"></div>
<div id="how" class="hide"><p id="tip"></p><button type="button" class="back" data-op="back">Назад</button></div>
<div id="vid" class="rows hide"></div>
<div id="pad" class="hide"></div>
<p id="e"></p>
<script>
(function(){
var S={},prev=0,timer=0;
function $(id){return document.getElementById(id);}
function show(id,on){$(id).classList.toggle("hide",!on);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function render(d){
if(!d){return;}
S=d;
$("t").textContent=d.name||"";
$("s").textContent=d.plan||"";
$("bar").style.width=Math.round(100*(d.i||0)/Math.max(1,d.n||1))+"%";
var html="",k,cur=d.set||0,ph=d.ph,cls;
for(k=1;k<=(d.sets||0);k++){
cls=(ph=="done"||k<cur||(ph=="rest"&&k<=cur))?"done":(k==cur?"now":"");
html+='<i class="'+cls+'"></i>';
}
$("dots").innerHTML=html;
var work=ph=="work"||!ph,rest=ph=="rest",rpe=ph=="rpe",kgph=ph=="kg",vid=ph=="vid";
show("hero",work||rpe||rest||kgph);
show("work",work);
show("skip",work);
show("q2",work);
show("alt",ph=="alt");
show("how",ph=="how");
show("vid",vid);
show("pad",kgph);
show("ringbox",rest);
if(work||rpe){
var kg=d.kg==null?"—":d.kg,reps=d.reps==null?"—":d.reps;
$("hero").innerHTML="<b>"+kg+" кг</b> <span>× "+reps+"</span>";
}
if(kgph){$("hero").innerHTML="<b>"+(d.draft||"—")+"</b> <span>кг</span>";}
$("unit").textContent=d.timed?"сек":"повт";
var go=$("go");
if(ph=="done"){go.setAttribute("data-op","sum");go.textContent="Итог";}
else if(rest){go.setAttribute("data-op","skip");go.textContent="Пропустить";}
else if(rpe){go.setAttribute("data-op","ok");go.textContent="Дальше";}
else{go.setAttribute("data-op","ok");go.textContent="Готово";}
show("go",work||rpe||rest||ph=="done"||kgph);
if(ph=="alt"){
var box="",a,list=d.alts||[];
if(d.note){box+='<p class="hint">'+esc(d.note)+"</p>";}
for(a=0;a<list.length&&a<3;a++){box+='<button type="button" data-op="alt:'+a+'">'+esc(list[a])+"</button>";}
if(!list.length&&!d.note){box+='<p class="hint">Похожих упражнений нет.</p>';}
box+='<button type="button" class="back" data-op="back">Назад</button>';
$("alt").innerHTML=box;
}
if(ph=="how"){$("tip").textContent=d.tip||"Описания пока нет";}
if(kgph&&!$("pad").dataset.ready){
var keys="123456789.0x",labels="123456789.0⌫",b="",i;
for(i=0;i<keys.length;i++){b+='<button type="button" data-op="n:'+keys[i]+'">'+labels[i]+"</button>";}
$("pad").innerHTML=b;$("pad").dataset.ready="1";
}
if(vid){
var box="",v,list=d.vids||[];
for(v=0;v<list.length;v++){box+='<button type="button" data-url="'+esc(list[v].u)+'">'+esc(list[v].t||"Видео")+"</button>";}
if(!list.length){box="<p>Видео пока нет</p>";}
box+='<button type="button" class="back" data-op="back">Назад</button>';
$("vid").innerHTML=box;
}
if((d.log||0)>prev){try{TelegramWidget.HapticFeedback.notificationOccurred("success");}catch(err){}prev=d.log;}
if(rest){ring();}
}
function ring(){
if(S.ph!="rest"){return;}
var left=Math.max(0,(S.restUntil||0)*1000-Date.now());
var total=Math.max(1,(S.rest||90)*1000);
$("arc").style.strokeDashoffset=(100.5*(1-Math.min(1,left/total))).toFixed(1);
$("hero").innerHTML="<b>"+Math.ceil(left/1000)+"</b> <span>отдых</span>";
if(left>0){cancelAnimationFrame(timer);timer=requestAnimationFrame(ring);}
}
function rawOf(answer){
if(!answer){return "";}
if(typeof answer=="string"){return answer;}
return typeof answer.result=="string"?answer.result:"";
}
function take(answer){
$("e").textContent="";
var raw=rawOf(answer);if(!raw){return;}
var d;try{d=JSON.parse(raw);}catch(err){return;}
if(d.err){$("e").textContent="Не вышло";return;}
render(d);
}
function fail(err){
var code=err&&err.code;
if(code=="TIMEOUT"||code=="FAILED"){$("e").textContent="Нет связи";}
}
document.body.addEventListener("click",function(ev){
var node=ev.target&&ev.target.closest?ev.target.closest("button"):null;
if(!node){return;}
var url=node.getAttribute("data-url");
if(url){try{TelegramWidget.openLink(url);}catch(err){$("e").textContent="Не открылось";}return;}
var op=node.getAttribute("data-op");
if(!op){return;}
$("e").textContent="";
var pending=TelegramWidget.request(op);
if(op=="w+"||op=="w-"){try{TelegramWidget.HapticFeedback.selectionChanged();}catch(err){}}
pending.then(take,fail);
});
function boot(){
try{render(JSON.parse(TelegramWidget.chatData));}catch(err){}
if(TelegramWidget.onEvent){TelegramWidget.onEvent("chatDataChanged",function(){try{render(JSON.parse(TelegramWidget.chatData));}catch(err){}});}
}
boot();
})();
</script>
</body></html>
